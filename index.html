<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>牛牛游戏</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style.css"/>

  <link rel="stylesheet" href="web_host/web_host.css"/>
</head>
<body>
  <main id="WebLoginHost" class="web-login-host">
    <form id="WebLoginForm" class="web-login-card">
      <h1 class="web-login-title">牛牛测试登录</h1>
      <p class="web-login-description">支持账号密码或 UID Token 登录测试</p>
      <div class="web-login-tabs" role="tablist">
        <button id="WebAccountTab" class="web-login-tab is-active" type="button" data-login-mode="account">账号密码</button>
        <button id="WebTokenTab" class="web-login-tab" type="button" data-login-mode="token">UID Token</button>
      </div>
      <div id="WebAccountFields">
        <label class="web-login-label" for="WebLoginAccount">账号</label>
        <input id="WebLoginAccount" class="web-login-input" type="text" autocomplete="username"/>
        <label class="web-login-label" for="WebLoginPassword">密码</label>
        <input id="WebLoginPassword" class="web-login-input" type="password" autocomplete="current-password"/>
      </div>
      <div id="WebTokenFields" class="web-login-fields-hidden">
        <label class="web-login-label" for="WebLoginUid">UID</label>
        <input id="WebLoginUid" class="web-login-input" type="number" min="1" inputmode="numeric"/>
        <label class="web-login-label" for="WebLoginToken">Token</label>
        <input id="WebLoginToken" class="web-login-input" type="password" autocomplete="off"/>
      </div>
      <button id="WebLoginButton" class="web-login-button" type="submit">登录</button>
      <p id="WebLoginStatus" class="web-login-status" role="alert"></p>
    </form>
  </main>
  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>
  

<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script src="web_host/web_host.js" charset="utf-8"></script>
<script>
  window.CocosWebGameHost.start({
    startGame: function startCocosGame() {
      return System.import('./index.js');
    }
  }).catch(function reportHostError(error) {
    console.error('网页宿主启动失败', error);
  });
</script>

</body>
</html>
